services:
  openblur:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openblur:latest
    container_name: openblur
    restart: unless-stopped
    environment:
      # Optional: your own Tumblr API token. Leave empty to use the bundled one.
      OPENBLUR_TUMBLR_API_TOKEN: ""
    ports:
      - "8000:8000"
