services:
  hyperblur:
    image: ghcr.io/dan1165/hyperblur:latest
    container_name: hyperblur
    restart: always
    environment:
      # Optional: your own Tumblr API token. Empty uses the bundled one.
      HYPERBLUR_TUMBLR_API_TOKEN: "${HYPERBLUR_TUMBLR_API_TOKEN:-}"
      HYPERBLUR_PORT: "${HYPERBLUR_PORT:-8000}"
    ports:
      - "${HYPERBLUR_PORT:-8000}:${HYPERBLUR_PORT:-8000}"
    # The image is scratch, so the probe is the binary itself.
    healthcheck:
      test: ["CMD", "/hyperblur", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
